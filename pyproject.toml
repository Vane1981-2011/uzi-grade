[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uzi-grade"
version = "1.0.0"
description = "A recomputable L1-L5 skill rating: every claim carries a command, an exit code and a sha256."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vane1981-2011" }]
keywords = ["skills", "audit", "reproducibility", "agent"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
uzi = "uzi_grade.cli:main"

[project.urls]
Homepage = "https://github.com/Vane1981-2011/uzi-grade"
Repository = "https://github.com/Vane1981-2011/uzi-grade"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
