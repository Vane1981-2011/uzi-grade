name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest -q

      - name: Judge discrimination (kill-rate, baseline false positives)
        run: uzi selftest

      - name: Grade the synthetic corpus (findings expected -> rc 1)
        run: |
          set +e
          uzi grade --all examples --out /tmp/uzi-report
          rc=$?
          set -e
          test "$rc" -eq 1
          test -f /tmp/uzi-report/report.json

      - name: Verify twice, compare verify_sha256
        run: |
          uzi verify /tmp/uzi-report/report.json > /tmp/v1.json
          uzi verify /tmp/uzi-report/report.json > /tmp/v2.json
          python - <<'PY'
          import json
          a = json.load(open("/tmp/v1.json"))
          b = json.load(open("/tmp/v2.json"))
          assert a["matched"] == a["skills"], a["mismatched"]
          assert a["report_sha256_match"] and a["report_seal_match"]
          assert a["verify_sha256"] == b["verify_sha256"]
          print("verify ok:", a["verify_sha256"])
          PY

      - name: Truncated scan must exit 2
        run: |
          set +e
          uzi grade --all examples --max 1 --out /tmp/uzi-trunc
          rc=$?
          set -e
          test "$rc" -eq 2
          python - <<'PY'
          import json
          r = json.load(open("/tmp/uzi-trunc/report.json"))
          t = r["truncation"]
          assert t["truncated"] is True
          assert t["omitted_count"] == 3, t
          print("truncation recorded:", t["omitted"])
          PY
